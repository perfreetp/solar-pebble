<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>潮沟网络工作台 — 海岸带调查队</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-0: #0b1418;
        --fg: #dcecee;
        --accent: #4fd1c5;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #0b1418;
        color: #dcecee;
        font-family: 'Inter', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body { overflow: hidden; }
      #body { height: 100%; min-height: 0; }

      #shell { height: 100vh; display: block; }

      /* 工作台 light-DOM 布局 */
      .workspace {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr) 300px;
        gap: 10px;
        padding: 10px;
        height: 100%;
        min-height: 0;
      }
      .rail {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 0;
        overflow-y: auto;
        padding-right: 2px;
      }
      .stage {
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 8px;
        min-height: 0;
        min-width: 0;
      }
      .stage-tools {
        display: flex;
        align-items: center;
        gap: 7px;
        flex-wrap: wrap;
      }
      .stage-tools .spacer { flex: 1; }
      .stage-tools button {
        font: inherit;
        font-size: 12.5px;
        color: #dcecee;
        background: #17272e;
        border: 1px solid #27424c;
        border-radius: 5px;
        padding: 6px 12px;
        cursor: pointer;
      }
      .stage-tools button:hover { background: #1e333b; border-color: #64b5d6; }
      .stage-tools button.primary {
        background: linear-gradient(180deg, #2f9e95, #237a75);
        border-color: #3fb8ad;
        color: #f2fffd;
        font-weight: 600;
      }
      .stage-tools button.primary:hover { background: linear-gradient(180deg, #37b3a8, #288a83); }
      map-canvas { min-height: 0; height: 100%; }
      .stage-foot {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 11.5px;
        color: #648089;
        padding: 0 2px;
      }
      .stage-foot .spacer { flex: 1; }
      .stage-foot .chip {
        padding: 2px 8px;
        border-radius: 999px;
        background: #17272e;
        border: 1px solid #1c333b;
        color: #93adb4;
      }
      .stage-foot .chip.warn { color: #f2b04a; border-color: rgba(242, 176, 74, 0.35); }

      #archive, #compare, #report {
        height: 100%;
        min-height: 0;
        padding: 10px;
        overflow: hidden;
      }
      #archive[hidden], #compare[hidden], #report[hidden] { display: none; }

      @media (max-width: 1180px) {
        .workspace { grid-template-columns: 290px minmax(0, 1fr) 272px; }
      }
      @media (max-width: 1180px) {
        .workspace { grid-template-columns: 280px minmax(0, 1fr) 264px; }
      }
      @media (max-width: 980px) {
        body { overflow: auto; }
        .workspace {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: auto auto auto;
          height: auto;
        }
        /* 窄屏: 地图优先, 参数在下 */
        .stage { order: 1; height: auto; grid-template-rows: auto minmax(360px, 52vh) auto; }
        .rail-left { order: 2; }
        .rail-right { order: 3; }
        .rail { overflow: visible; }
        #shell { height: auto; min-height: 100vh; }
        .main { overflow: visible; }
        #archive, #compare, #report { height: auto; overflow: visible; }
        .stage-tools { flex-wrap: wrap; }
      }
      @media (max-width: 680px) {
        .workspace { padding: 8px; gap: 8px; }
        .stage-tools button { font-size: 12px; padding: 5px 9px; }
        .stage-foot { flex-wrap: wrap; }
      }
    </style>
  </head>
  <body>
    <app-shell id="shell">
      <div id="body" slot="body"></div>
    </app-shell>
    <script type="module" src="./app.js"></script>
  </body>
</html>
